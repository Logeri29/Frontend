name: CI Checks

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build_and_lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend deps
        run: npm ci

      - name: Install server deps
        run: npm --prefix server ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build