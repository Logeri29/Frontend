name: Secret Sanity Check

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  check_secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy secrets
        run: |
          echo "Checking secrets..."
          missing=0

          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN: NOT SET"
            missing=1
          else
            echo "VERCEL_TOKEN: set"
          fi

          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK: set"
          else
            echo "RENDER_DEPLOY_HOOK: not set"
          fi

          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ] && { [ -z "${{ secrets.RENDER_API_KEY }}" ] || [ -z "${{ secrets.RENDER_SERVICE_ID }}" ]; }; then
            echo "Render API deploy info: RENDER_API_KEY or RENDER_SERVICE_ID missing"
            missing=1
          else
            echo "Render API deploy info: ok or using deploy hook"
          fi

          if [ $missing -eq 1 ]; then
            echo "One or more required deploy secrets are missing."
            exit 1
          fi

          echo "All required deploy secrets appear present or deploy hook provided."